<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Syahrullkce</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow p-4">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center">
        <img src="https://i.imgur.com/YESBNzA.jpg" alt="Logo Toko Syahrullkce" class="w-12 h-12 mr-2">
        <h1 class="text-2xl font-bold">🛍️ Toko Syahrullkce</h1>
      </div>
      <button onclick="showCart()" class="relative text-blue-600 hover:underline">
        🛒 Keranjang
        <span id="cart-count" class="absolute -top-2 -right-4 bg-red-500 text-white text-xs rounded-full px-2">0</span>
      </button>
    </div>
  </header>

  <!-- Produk -->
  <main class="container mx-auto py-10 px-4">
    <h2 class="text-3xl font-bold mb-8 text-center">✨ Produk Tersedia ✨</h2>
    <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8"></div>
  </main>

  <!-- Cart Popup -->
  <div id="cart-popup" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 relative">
      <button onclick="closeCart()" class="absolute top-2 right-4 text-gray-500 hover:text-red-500 text-2xl">&times;</button>
      <h3 class="text-xl font-bold mb-4">Keranjang Belanja</h3>
      <ul id="cart-items" class="space-y-2 mb-4"></ul>
      <p class="text-right font-bold">Total: Rp <span id="cart-total">0</span></p>

      <!-- Tombol Pembayaran -->
      <div class="grid grid-cols-1 gap-2 mt-4">
        <button onclick="checkoutWhatsApp()" class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600">
          Checkout via WhatsApp
        </button>
        <button class="w-full bg-orange-500 text-white py-2 rounded hover:bg-orange-600" onclick="alert('Metode pembayaran ShopeePay belum aktif. Hubungi admin.')">
          Bayar via ShopeePay
        </button>
        <button class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600" onclick="alert('Metode pembayaran DANA belum aktif. Hubungi admin.')">
          Bayar via DANA
        </button>
        <button class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700" onclick="alert('Metode pembayaran GoPay belum aktif. Hubungi admin.')">
          Bayar via GoPay
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t text-center p-4 mt-8">
    <p>&copy; 2025 Toko Syahrullkce.</p>
  </footer>

  <!-- Script -->
  <script>
    const products = [
      {
        name: 'Gantungan kunci bisa 1 sisi atau dua sisi',
        price: 5000,
        imageUrl: 'https://i.imgur.com/VQ969Uq.jpg',
        description: 'Gantungan kunci unik yang dapat dicetak 1 sisi atau 2 sisi, desain custom dan cocok untuk souvenir.',
        stock: 70
      },
      {
        name: 'Gantungan kunci bulat 1 sisi',
        price: 3000,
        imageUrl: 'https://i.imgur.com/8lLWl2w.jpg',
        description: 'Gantungan kunci bulat 1 sisi dengan desain custom dan menarik.',
        stock: 100
      },
      {
        name: 'Polaroid 1 foto',
        price: 500,
        imageUrl: 'https://i.imgur.com/O8tU1MI.jpg',
        description: 'Foto polaroid dengan desain custom, ukuran kecil.',
        stock: 100
      }
    ];

    let cart = [];

    function addToCart(name, price, stock, index) {
      if (stock <= 0) {
        alert('Stok produk habis!');
        return;
      }
      products[index].stock--;
      cart.push({ name, price });
      updateCartCount();
      alert(`${name} ditambahkan ke keranjang!`);
      loadProducts();
    }

    function removeFromCart(index) {
      const item = cart[index];
      cart.splice(index, 1);
      const productIndex = products.findIndex(product => product.name === item.name);
      products[productIndex].stock++;
      updateCartCount();
      loadCartItems();
      loadProducts();
    }

    function updateCartCount() {
      document.getElementById('cart-count').innerText = cart.length;
    }

    function showCart() {
      loadCartItems();
      document.getElementById('cart-popup').classList.remove('hidden');
    }

    function loadCartItems() {
      const cartItemsEl = document.getElementById('cart-items');
      const cartTotalEl = document.getElementById('cart-total');
      cartItemsEl.innerHTML = '';
      let total = 0;
      cart.forEach((item, index) => {
        total += item.price;
        cartItemsEl.innerHTML += `
          <li class="flex justify-between items-center">
            <span>${item.name}</span>
            <span>Rp ${item.price.toLocaleString()}</span>
            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 ml-2 text-sm">Hapus</button>
          </li>
        `;
      });
      cartTotalEl.innerText = total.toLocaleString();
    }

    function closeCart() {
      document.getElementById('cart-popup').classList.add('hidden');
    }

    function checkoutWhatsApp() {
      if (cart.length === 0) {
        alert("Keranjang kosong!");
        return;
      }
      let message = "Halo! Saya ingin memesan:\n";
      let total = 0;
      cart.forEach((item, index) => {
        message += `${index + 1}. ${item.name} - Rp ${item.price.toLocaleString()}\n`;
        total += item.price;
      });
      message += `\nTotal: Rp ${total.toLocaleString()}`;
      const encodedMessage = encodeURIComponent(message);
      const phoneNumber = "6285793313045";
      window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, "_blank");
      cart = [];
      updateCartCount();
      closeCart();
      loadProducts();
    }

    function loadProducts() {
      const productList = document.getElementById('product-list');
      productList.innerHTML = '';
      products.forEach((product, index) => {
        productList.innerHTML += `
          <div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-xl transition-shadow duration-300">
            <div class="overflow-hidden">
              <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-56 object-cover transform hover:scale-105 transition-transform duration-300" />
            </div>
            <div class="p-4">
              <h3 class="text-lg font-bold mb-1">${product.name}</h3>
              <p class="text-gray-600 text-sm mb-2">${product.description}</p>
              <p class="text-blue-600 font-semibold text-lg mb-1">Rp ${product.price.toLocaleString()}</p>
              <p class="text-gray-500 text-sm mb-3">Stok: ${product.stock}</p>
              <button onclick="addToCart('${product.name}', ${product.price}, ${product.stock}, ${index})"
                class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-2 rounded-lg font-semibold hover:from-blue-600 hover:to-blue-700 transition-colors duration-300">
                Tambah ke Keranjang
              </button>
            </div>
          </div>
        `;
      });
    }

    window.onload = () => {
      loadProducts();
    };
  </script>
</body>
</html>
