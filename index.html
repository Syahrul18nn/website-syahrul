<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syahrul store - Kece</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #333);
            margin: 0;
            padding: 0;
            color: white;
        }
        header {
            background: url('https://i.imgur.com/YESBNzA.jpg') center/cover;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
        }
        header h1 {
            font-size: 2.5em;
        }
        .container {
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            margin: -50px auto 30px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        label {
            display: block;
            margin-top: 20px;
            font-size: 0.9em;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: none;
            font-size: 1em;
        }
        input, select {
            background: rgba(255, 255, 255, 0.2);
            color: rgb(0, 0, 0);
        }
        button {
            background: linear-gradient(90deg, #ff5252, #ff7b00);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            background-color: #ff3e00;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #aaa;
        }
        .dropdown {
            transition: transform 0.3s ease, background-color 0.3s;
        }
        .dropdown:hover {
            transform: translateY(-5px);
            background-color: rgba(26, 255, 0, 0.3);
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0, 0, 0);
            background-color: rgba(0, 0, 0, 0.4);
            padding-top: 60px;
        }
        .modal-content {
            background-color: #000000;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>🔥 Top Up Free Fire 🔥</h1>
</header>

<div class="container">
    <form id="topupForm">
        <label for="playerId">Player ID</label>
        <input type="text" id="playerId" name="playerId" placeholder="Masukkan Player ID" required>

        <label for="jumlah">Jumlah Diamond</label>
        <select id="jumlah" name="jumlah" required class="dropdown">
            <option value="50">50 Diamond - Rp10.000</option>
            <option value="100">100 Diamond - Rp20.000</option>
            <option value="200">200 Diamond - Rp40.000</option>
        </select>

        <label for="pembayaran">Metode Pembayaran</label>
        <select id="pembayaran" name="pembayaran" required class="dropdown">
            <option value="gopay">GoPay</option>
            <option value="dana">DANA</option>
            <option value="ovo">OVO</option>
            <option value="walet">Walet</option>
        </select>

        <!-- Dropdown untuk memilih e-wallet (hanya muncul jika memilih Walet) -->
        <div id="waletOptions" style="display: none;">
            <label for="waletMethod">Pilih Metode Walet</label>
            <select id="waletMethod" name="waletMethod" class="dropdown">
                <option value="dana">DANA</option>
                <option value="ovo">OVO</option>
                <option value="gopay">GoPay</option>
            </select>
        </div>

        <button type="submit">🚀 Bayar Sekarang</button>
    </form>
</div>

<footer>
    &copy; 2025 Syahrul store . All rights reserved.
</footer>

<!-- Modal Konfirmasi -->
<div id="confirmModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <p id="modalText"></p>
    <button id="confirmButton" style="background-color: green;">Konfirmasi Pembayaran</button>
    <button id="cancelButton" style="background-color: red;">Batal</button>
  </div>
</div>

<script>
    const modal = document.getElementById("confirmModal");
    const closeModal = document.getElementsByClassName("close")[0];
    const confirmButton = document.getElementById("confirmButton");
    const cancelButton = document.getElementById("cancelButton");

    // Menangani perubahan metode pembayaran
    document.getElementById('pembayaran').addEventListener('change', function() {
        const waletOptions = document.getElementById('waletOptions');
        if (this.value === 'walet') {
            waletOptions.style.display = 'block';  // Tampilkan pilihan untuk Walet
        } else {
            waletOptions.style.display = 'none';   // Sembunyikan pilihan Walet
        }
    });

    document.getElementById('topupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const playerId = document.getElementById('playerId').value;
        const jumlah = document.getElementById('jumlah').value;
        const pembayaran = document.getElementById('pembayaran').value;
        const waletMethod = document.getElementById('waletMethod') ? document.getElementById('waletMethod').value : '';

        let confirmMessage = `🔥 Terima kasih! Pesanan top up ${jumlah} diamond untuk ID ${playerId} dengan pembayaran ${pembayaran}`;
        
        if (pembayaran === 'walet') {
            confirmMessage += ` melalui ${waletMethod}.`;
        } else {
            confirmMessage += ` menggunakan ${pembayaran}.`;
        }

        // Menampilkan modal konfirmasi
        document.getElementById("modalText").textContent = confirmMessage;
        modal.style.display = "block";

        // Ketika menekan tombol konfirmasi
        confirmButton.onclick = function() {
            const message = `Pesanan top up Free Fire: \nPlayer ID: ${playerId}\nJumlah Diamond: ${jumlah}\nMetode Pembayaran: ${pembayaran}\n${pembayaran === 'walet' ? 'Metode Walet: ' + waletMethod : ''}\n\nHarap konfirmasi pembayaran!`;

            // Ganti 'nomor-wa' dengan nomor WhatsApp pemilik toko tanpa tanda '+'
            const phoneNumber = 'nomor-wa'; // contoh: 6281234567890
            const whatsappUrl = `https://wa.me/${6285793313045}?text=${encodeURIComponent(message)}`;

            // Arahkan ke WhatsApp
            window.location.href = whatsappUrl;

            // Menutup modal
            modal.style.display = "none";
        }

        // Ketika menekan tombol batal
        cancelButton.onclick = function() {
            alert('Pembayaran dibatalkan.');
            modal.style.display = "none";
        }

        // Menutup modal ketika klik di luar modal
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Menutup modal
        closeModal.onclick = function() {
            modal.style.display = "none";
        }
    });
</script>
</body>
</html>
